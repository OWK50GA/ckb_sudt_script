[workspace]
resolver = "2"

members = [
  "deployer",
  "tests",
]

# The contracts are built separately via `make build` using their own
# workspace roots. They are excluded here so that host-only dependencies
# (reqwest, bytes, etc.) from the deployer are never compiled for RISC-V.
exclude = [
  "contracts/simple-lock",
  "contracts/timelock-lock",
  "contracts/ckb_sudt_script",
]

[profile.release]
overflow-checks = true
strip = true
codegen-units = 1
debug = false
opt-level = "z"
